<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>Image Editor</h1>
      <div class="header-actions">
        <button id="btn-new" title="New canvas">New</button>
        <button id="btn-open" title="Open image">Open</button>
        <button id="btn-save" title="Save image">Save</button>
        <button id="btn-undo" title="Undo">Undo</button>
        <button id="btn-redo" title="Redo">Redo</button>
      </div>
    </header>

    <div class="main-layout">
      <!-- Left Toolbar -->
      <aside class="toolbar">
        <div class="tool-group">
          <h3>Tools</h3>
          <button class="tool-btn active" data-tool="brush" title="Brush">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34a.996.996 0 00-1.41 0L9 12.25 11.75 15l8.96-8.96a.996.996 0 000-1.41z" fill="currentColor"/></svg>
            <span>Brush</span>
          </button>
          <button class="tool-btn" data-tool="eraser" title="Eraser">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 01-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0zM4.22 15.58l3.54 3.53c.78.79 2.04.79 2.83 0l3.53-3.53-4.95-4.95-4.95 4.95z" fill="currentColor"/></svg>
            <span>Eraser</span>
          </button>
          <button class="tool-btn" data-tool="line" title="Line">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M19 13H5v-2h14v2z" fill="currentColor" transform="rotate(-45 12 12)"/></svg>
            <span>Line</span>
          </button>
          <button class="tool-btn" data-tool="rect" title="Rectangle">
            <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>Rect</span>
          </button>
          <button class="tool-btn" data-tool="circle" title="Circle">
            <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>Circle</span>
          </button>
          <button class="tool-btn" data-tool="text" title="Text">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 4v3h5.5v12h3V7H19V4H5z" fill="currentColor"/></svg>
            <span>Text</span>
          </button>
          <button class="tool-btn" data-tool="fill" title="Fill">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M16.56 8.94L7.62 0 6.21 1.41l2.38 2.38-5.15 5.15a1.49 1.49 0 000 2.12l5.5 5.5c.29.29.68.44 1.06.44s.77-.15 1.06-.44l5.5-5.5c.59-.58.59-1.53 0-2.12zM5.21 10L10 5.21 14.79 10H5.21zM19 11.5s-2 2.17-2 3.5c0 1.1.9 2 2 2s2-.9 2-2c0-1.33-2-3.5-2-3.5z" fill="currentColor"/></svg>
            <span>Fill</span>
          </button>
          <button class="tool-btn" data-tool="eyedropper" title="Eyedropper">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20.71 5.63l-2.34-2.34a1 1 0 00-1.41 0l-3.54 3.54-1.41-1.41-1.41 1.41 1.06 1.06-6.36 6.36a2 2 0 00-.59 1.42V18h3.33c.53 0 1.04-.21 1.41-.59l6.36-6.36 1.06 1.06 1.41-1.41-1.41-1.41 3.54-3.54a1 1 0 000-1.12z" fill="currentColor"/></svg>
            <span>Pick</span>
          </button>
          <button class="tool-btn" data-tool="crop" title="Crop">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M17 15h2V7c0-1.1-.9-2-2-2H9v2h8v8zM7 17V1H5v4H1v2h4v10c0 1.1.9 2 2 2h10v4h2v-4h4v-2H7z" fill="currentColor"/></svg>
            <span>Crop</span>
          </button>
        </div>

        <div class="tool-group">
          <h3>Options</h3>
          <label>
            Color
            <input type="color" id="color-picker" value="#000000" />
          </label>
          <label>
            Size
            <input type="range" id="brush-size" min="1" max="100" value="5" />
            <span id="brush-size-val">5</span>
          </label>
          <label>
            Opacity
            <input type="range" id="opacity" min="0" max="100" value="100" />
            <span id="opacity-val">100%</span>
          </label>
        </div>

        <div class="tool-group">
          <h3>Filters</h3>
          <button class="filter-btn" data-filter="grayscale">Grayscale</button>
          <button class="filter-btn" data-filter="sepia">Sepia</button>
          <button class="filter-btn" data-filter="invert">Invert</button>
          <button class="filter-btn" data-filter="blur">Blur</button>
          <button class="filter-btn" data-filter="brightness">Brighten</button>
          <button class="filter-btn" data-filter="contrast">Contrast</button>
        </div>
      </aside>

      <!-- Canvas Area -->
      <main class="canvas-area">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="editor-canvas" width="800" height="600"></canvas>
        </div>
        <div class="canvas-info">
          <span id="canvas-size">800 x 600</span>
          <span id="cursor-pos">0, 0</span>
          <span id="zoom-level">100%</span>
        </div>
      </main>

      <!-- Right Panel: AI Model -->
      <aside class="ai-panel">
        <h3>AI Image Generation</h3>
        <div class="ai-form">
          <label>
            Provider
            <select id="ai-provider">
              <option value="openai">OpenAI (DALL-E)</option>
              <option value="stability">Stability AI</option>
            </select>
          </label>
          <label>
            Model
            <select id="ai-model">
              <option value="dall-e-3">DALL-E 3</option>
              <option value="dall-e-2">DALL-E 2</option>
            </select>
          </label>
          <label>
            API Key
            <input type="password" id="ai-api-key" placeholder="Enter your API key" />
          </label>
          <label>
            Prompt
            <textarea id="ai-prompt" rows="4" placeholder="Describe the image you want to generate or how to edit the current image..."></textarea>
          </label>
          <div class="ai-actions">
            <button id="btn-ai-generate">Generate Image</button>
            <button id="btn-ai-apply" disabled>Apply to Canvas</button>
          </div>
          <div id="ai-status" class="ai-status"></div>
          <div id="ai-preview" class="ai-preview"></div>
        </div>

        <div class="ai-section">
          <h3>Canvas Actions</h3>
          <button id="btn-resize" class="action-btn">Resize Canvas</button>
          <button id="btn-flip-h" class="action-btn">Flip Horizontal</button>
          <button id="btn-flip-v" class="action-btn">Flip Vertical</button>
          <button id="btn-rotate-cw" class="action-btn">Rotate 90° CW</button>
          <button id="btn-rotate-ccw" class="action-btn">Rotate 90° CCW</button>
          <button id="btn-clear" class="action-btn danger">Clear Canvas</button>
        </div>
      </aside>
    </div>
  </div>

  <input type="file" id="file-input" accept="image/*" hidden />

  <!-- Modals -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
