<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>AI Image Editor</h1>
      <span class="header-badge">Powered by ModelsLab</span>
    </header>

    <div class="main-layout">
      <!-- Left Panel: Settings -->
      <aside class="settings-panel">
        <div class="panel-section">
          <h3>API Settings</h3>
          <label>
            API Key
            <input type="password" id="api-key" placeholder="Enter your ModelsLab API key" />
          </label>
        </div>

        <div class="panel-section">
          <h3>Model</h3>
          <label>
            Model ID
            <select id="model-select">
              <option value="flux">Flux</option>
              <option value="sd-1.5">Stable Diffusion 1.5</option>
              <option value="sdxl">Stable Diffusion XL</option>
              <option value="realistic-vision-v51">Realistic Vision v5.1</option>
              <option value="dreamshaper-v8">DreamShaper v8</option>
              <option value="midjourney">Midjourney</option>
            </select>
          </label>
        </div>

        <div class="panel-section">
          <h3>Dimensions</h3>
          <div class="dimension-row">
            <label>
              Width
              <select id="img-width">
                <option value="256">256</option>
                <option value="512" selected>512</option>
                <option value="768">768</option>
                <option value="1024">1024</option>
              </select>
            </label>
            <label>
              Height
              <select id="img-height">
                <option value="256">256</option>
                <option value="512" selected>512</option>
                <option value="768">768</option>
                <option value="1024">1024</option>
              </select>
            </label>
          </div>
        </div>

        <div class="panel-section">
          <h3>Generation Settings</h3>
          <label>
            Samples
            <select id="samples">
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </label>
          <label>
            Steps
            <input type="range" id="steps" min="10" max="50" value="30" />
            <span id="steps-val">30</span>
          </label>
          <label>
            Guidance Scale
            <input type="range" id="guidance" min="1" max="20" value="7.5" step="0.5" />
            <span id="guidance-val">7.5</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="enhance-prompt" />
            Enhance prompt
          </label>
        </div>

        <!-- Img2Img Strength (shown only in img2img mode) -->
        <div class="panel-section" id="strength-section" style="display:none;">
          <h3>Image-to-Image</h3>
          <label>
            Strength
            <input type="range" id="strength" min="0.1" max="1.0" value="0.7" step="0.05" />
            <span id="strength-val">0.7</span>
          </label>
          <p class="hint">Higher values = more transformation from the original image.</p>
        </div>
      </aside>

      <!-- Center: Prompt & Results -->
      <main class="content-area">
        <!-- Mode Tabs -->
        <div class="mode-tabs">
          <button class="mode-tab active" data-mode="txt2img">Text to Image</button>
          <button class="mode-tab" data-mode="img2img">Image to Image</button>
        </div>

        <!-- Image Input (shown only in img2img mode) -->
        <div id="img-input-section" class="img-input-section" style="display:none;">
          <h3>Source Image</h3>
          <div class="img-source-tabs">
            <button class="img-source-tab active" data-source="upload">Upload File</button>
            <button class="img-source-tab" data-source="url">Paste URL</button>
          </div>

          <!-- File Upload -->
          <div id="upload-area" class="upload-area">
            <div id="drop-zone" class="drop-zone">
              <div class="drop-zone-content">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p>Drag and drop an image here</p>
                <span>or</span>
                <label class="file-browse-btn">
                  Browse Files
                  <input type="file" id="file-input" accept="image/*" hidden />
                </label>
              </div>
            </div>
          </div>

          <!-- URL Input -->
          <div id="url-area" class="url-area" style="display:none;">
            <input type="text" id="img-url" placeholder="https://example.com/image.jpg" />
            <button id="btn-load-url" class="load-url-btn">Load</button>
          </div>

          <!-- Preview -->
          <div id="img-preview" class="img-preview" style="display:none;">
            <img id="preview-img" src="" alt="Source image preview" />
            <button id="btn-clear-img" class="clear-img-btn">Remove</button>
          </div>
        </div>

        <div class="prompt-section">
          <label>
            <h3>Prompt</h3>
            <textarea id="prompt" rows="3" placeholder="Describe the image you want to generate..."></textarea>
          </label>
          <label>
            <h3>Negative Prompt</h3>
            <textarea id="negative-prompt" rows="2" placeholder="What to exclude from the image (optional)..."></textarea>
          </label>
          <button id="btn-generate" class="generate-btn">Generate Image</button>
          <div id="status" class="status"></div>
        </div>

        <div class="results-section">
          <h3>Generated Images</h3>
          <div id="image-grid" class="image-grid">
            <div class="placeholder">Your generated images will appear here</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
