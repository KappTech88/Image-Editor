<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>Image Editor</h1>
      <span class="header-badge">Powered by ModelsLab</span>
    </header>

    <div class="main-layout">
      <!-- Left Panel -->
      <aside class="settings-panel">
        <div class="panel-section">
          <h3>Source Image</h3>
          <label>
            Image URL
            <input type="text" id="init-image-url" placeholder="Paste image URL here..." />
          </label>
          <div class="upload-divider">or</div>
          <div class="upload-area" id="upload-area">
            <input type="file" id="init-image-file" accept="image/png,image/jpeg,image/webp" hidden />
            <div class="upload-placeholder" id="upload-placeholder">
              <span class="upload-icon">+</span>
              <span>Click or drag image here</span>
            </div>
            <div class="upload-preview" id="upload-preview" style="display: none;">
              <img id="preview-img" alt="Source image preview" />
              <button class="remove-image-btn" id="remove-image" title="Remove image">x</button>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h3>Edit Settings</h3>
          <label>
            Strength
            <input type="range" id="strength" min="0.1" max="1.0" value="0.7" step="0.05" />
            <span id="strength-val">0.7</span>
          </label>
          <span class="hint">Lower = closer to original, Higher = more creative</span>
          <label>
            Aspect Ratio
            <select id="aspect-ratio">
              <option value="1:1" selected>1:1 (Square)</option>
              <option value="4:3">4:3 (Landscape)</option>
              <option value="3:4">3:4 (Portrait)</option>
              <option value="16:9">16:9 (Widescreen)</option>
              <option value="9:16">9:16 (Tall)</option>
              <option value="3:2">3:2</option>
              <option value="2:3">2:3</option>
            </select>
          </label>
          <label>
            Resolution
            <select id="resolution">
              <option value="2k" selected>2K (High Quality)</option>
              <option value="1k">1K (Fast)</option>
            </select>
          </label>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="content-area">
        <div class="prompt-section">
          <label>
            <h3>Edit Prompt</h3>
            <textarea id="prompt" rows="3" placeholder="Describe how you want the image edited... (e.g. &quot;change her pants to yellow&quot;)"></textarea>
          </label>
          <button id="btn-edit" class="edit-btn">Edit Image</button>
          <div id="status" class="status"></div>
        </div>

        <div class="results-section">
          <h3>Result</h3>
          <div id="image-grid" class="image-grid">
            <div class="placeholder">Upload an image and describe your edit</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
